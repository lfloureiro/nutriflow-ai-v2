[project]
name = "nutriflow-api"
version = "0.1.0"
description = "NutriFlow AI v2 API"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.44,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.18,<2.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.13,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.2,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "httpx2>=2.0,<3.0",
    "ruff>=0.12,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

